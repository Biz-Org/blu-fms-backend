name: Build and Bump Version

on:
  pull_request:
    branches:
      - 'staging'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------
  # 1. BUILD DOCKER IMAGE
  # -------------------------------
  dockerBuild:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get repo name
        run: echo "REPO=$(echo ${{ github.repository }} | awk -F/ '{print $2}')" >> $GITHUB_ENV

      - name: Git LFS Pull
        run: git lfs pull

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            bizlem123/${{ env.REPO }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # -------------------------------
  # 2. BUMP VERSION → TAG → PUSH DOCKER IMAGE
  # -------------------------------
  bumpVersion:
    name: Bump Version & Tag Release
    needs: dockerBuild
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        if: >
          github.event_name == 'push' && github.ref == 'refs/heads/staging' ||
          github.event_name == 'pull_request' && github.base_ref == 'staging'

        id: tag
        uses: anothrNick/github-tag-action@1.67.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch
          PRERELEASE: false

      - name: Build & push Docker image using new tag
        run: |
          IMAGE_TAG=${{ steps.tag.outputs.tag }}
          IMAGE_NAME=bizlem123/blu-fms-backend

          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASS }}
          docker push $IMAGE_NAME:$IMAGE_TAG

      - name: Checkout blu-devops-updated repository
        uses: actions/checkout@v4
        with:
          repository: Biz-org/blu-devops-updated
          ref: main
          token: ${{ secrets.GIT_TOKEN }}
          path: blu-devops-updated

      - name: Update values.yaml
        working-directory: blu-devops-updated/
        run: |
          IMAGE_TAG=${{ steps.tag.outputs.tag }}
          BRANCH="${{ github.event.pull_request.base.ref }}"

          if [[ "$BRANCH" == "staging" ]]; then
            WORKING_DIR="environment/e2e/staging/app/blu-fms-backend"
            cd $WORKING_DIR
            sed -i "s#^\( *tag: *\).*#\1\"$IMAGE_TAG\"#" dev.yaml
          fi

      - name: Check for Changes
        id: check_changes
        working-directory: blu-devops-updated
        run: |
          git diff --quiet || echo "has_changes=true" >> $GITHUB_ENV

      - name: Commit and Push Changes
        if: env.has_changes == 'true'
        working-directory: blu-devops-updated
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@github.com"
          git add .
          git commit -m 'Update image version for values file'
          git pull --rebase origin main
          git push origin main

      - name: Create GitHub Release
        if: steps.tag.outputs.tag
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ steps.tag.outputs.tag }}"

  # -------------------------------
  # 3. TRIGGER DEVOPS WORKFLOW
  # -------------------------------
 
  trigger-devops:
    name: Trigger blu-devops-updated workflow
    needs: bumpVersion
    runs-on: ubuntu-latest
    steps:
    - name: Dispatch event to devops repo
      uses: peter-evans/repository-dispatch@v3
      with:
        token: ${{ secrets.GIT_TOKEN }}
        repository: Biz-org/blu-devops-updated
        event-type: trigger-workflow-blu-fms-backend
        client-payload: |
          {
            "branch": "${{ github.ref_name }}",
            "base_ref": "${{ github.event.pull_request.base.ref }}"
          }
