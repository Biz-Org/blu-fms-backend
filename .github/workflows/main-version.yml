name: build

on:
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:
jobs:
  update-prod-tag:  
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # CHECKOUT DEVOPS REPO (THIS REPO CONTAINS uat.yaml)
      # ---------------------------------------------------------
      - name: Checkout blu-devops-updated repository
        uses: actions/checkout@v4
        with:
          repository: Biz-org/blu-devops-updated
          ref: main
          token: ${{ secrets.GIT_TOKEN }}
          path: blu-devops-updated

      - name: Debug structure
        run: |
          echo "Listing structure of blu-devops-updated..."
          ls -R blu-devops-updated

      # ---------------------------------------------------------
      # GET UAT TAG FROM uat.yaml (INSIDE blu-devops-updated)
      # ---------------------------------------------------------
      - name: Get UAT tag from uat.yaml
        id: get_uaq_tag
        working-directory: blu-devops-updated
        run: |
          FILE="environment/e2e/uat/app/blu-fms-backend/uat.yaml"
          
          echo "Looking for file: $FILE"
          if [ ! -f "$FILE" ]; then
            echo "❌ ERROR: File not found at: $FILE"
            exit 1
          fi

          TAG=$(grep -E "^[[:space:]]*tag:" "$FILE" | sed -E 's/^[[:space:]]*tag:[[:space:]]*"?([^"]*)"?/\1/')
          
          if [ -z "$TAG" ]; then
            echo "❌ ERROR: No tag value found in uat.yaml"
            exit 1
          fi

          echo "✔ Extracted UAT TAG: $TAG"
          echo "UAT_TAG=$TAG" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # UPDATE PROD YAML IN SAME DEVOPS REPO
      # ---------------------------------------------------------
      - name: Update PROD values.yaml
        working-directory: blu-devops-updated
        run: |
          echo "Current directory: $(pwd)"
          IMAGE_TAG=$UAT_TAG
          PROD_FILE="environment/e2e/production/app/blu-fms-backend/prod.yaml"
          echo $pwd;
          if [ ! -f "$PROD_FILE" ]; then
            echo "❌ PROD file not found: $PROD_FILE"
            exit 1
          fi

          echo "Updating $PROD_FILE with tag $IMAGE_TAG"
          
          sed -i "s#^\( *tag: *\).*#\1\"$IMAGE_TAG\"#" "$PROD_FILE"

          echo "Updated prod.yaml content:"
          cat "$PROD_FILE"

      # ---------------------------------------------------------
      # CHECK FOR CHANGES
      # ---------------------------------------------------------
      - name: Check for changes
        working-directory: blu-devops-updated
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_ENV
          else
            echo "has_changes=true" >> $GITHUB_ENV
          fi

      # ---------------------------------------------------------
      # COMMIT & PUSH IF CHANGED
      # ---------------------------------------------------------
      - name: Commit and Push Changes
        if: env.has_changes == 'true'
        working-directory: blu-devops-updated
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@github.com"
          git add .
          git commit -m "Update prod image tag from UAT: $UAT_TAG"
          git pull --rebase origin main
          git push origin main

  # ---------------------------------------------------------
  # TRIGGER DEVOPS WORKFLOW
  # ---------------------------------------------------------
  trigger-devops:
    if: github.event.pull_request.base.ref == 'main'
    needs: update-prod-tag
    runs-on: ubuntu-latest
    steps:
      - name: Trigger workflow blu-devops-updated
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GIT_TOKEN }}
          repository: Biz-org/blu-devops-updated
          event-type: trigger-workflow-blu-fms-backend
          client-payload: |
            {
              "branch": "${{ github.ref_name }}",
              "base_ref": "${{ github.event.pull_request.base.ref }}"
            }
